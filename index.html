"Buda (Sidarta Gautama)":["Todas as coisas têm a mente como precursora e como guia: são feitas pela mente.","Ninguém nos salva senão nós mesmos. Nós mesmos devemos trilhar o caminho.","Vencer a si mesmo é maior do que vencer mil homens em batalha.","Sede ilhas para vós mesmos.","Todas as coisas condicionadas são impermanentes.","Gota a gota, a vasilha d’água se enche; assim o sábio se enche de bem.","Não te lamentes pelo passado nem te percas no futuro: o passado já se foi e o futuro não chegou.","Como a mãe protege com a vida o seu filho único, cultiva um coração sem limites por todos os seres.","Vós mesmos deveis fazer o esforço; os Budas apenas indicam o caminho."],
"Lao Tsé":["O Tao que pode ser dito não é o Tao eterno.","Quem conhece os outros é sábio; quem conhece a si mesmo é iluminado.","O mais suave do mundo vence o mais duro.","Quem sabe contentar-se é rico.","O sábio não acumula: quanto mais dá aos outros, mais tem.","Governar um grande país é como cozinhar um pequeno peixe.","O sábio age sem agir e ensina sem palavras.","Quem sabe não fala; quem fala não sabe.","Nada é mais suave e fraco que a água, mas nada a supera ao atacar o duro.","Quem se põe na ponta dos pés não se sustenta.","Quem vence os outros tem força; quem vence a si mesmo é poderoso."]});

"Descartes":["O bom senso é a coisa do mundo mais bem distribuída.","Não basta ter o espírito bom; o principal é aplicá-lo bem.","Para examinar a verdade, é preciso, uma vez na vida, pôr todas as coisas em dúvida, tanto quanto possível.","Dividir cada dificuldade em tantas parcelas quantas forem possíveis e necessárias para melhor resolvê-las.","Procurar sempre vencer antes a mim mesmo do que à fortuna, e mudar antes os meus desejos do que a ordem do mundo.","A leitura de todos os bons livros é como uma conversa com as melhores pessoas dos séculos passados.","Nunca aceitar como verdadeira coisa alguma que eu não conhecesse evidentemente como tal.","Nada está inteiramente em nosso poder, exceto os nossos pensamentos."],
"Kant":["Pensamentos sem conteúdo são vazios; intuições sem conceitos são cegas.","Age apenas segundo uma máxima tal que possas querer ao mesmo tempo que ela se torne lei universal.","Age de tal maneira que uses a humanidade, tanto na tua pessoa como na de qualquer outro, sempre como fim e nunca simplesmente como meio.","De uma madeira tão retorcida como aquela de que o homem é feito, nada inteiramente reto pode ser construído.","Duas coisas enchem o ânimo de admiração e veneração sempre novas e crescentes: o céu estrelado acima de mim e a lei moral em mim.","Tive de suprimir o saber para dar lugar à fé.","O ser humano só se torna humano pela educação.","Todo o nosso conhecimento começa com os sentidos, passa ao entendimento e termina na razão."],
"Espinosa":["Os homens se enganam ao se julgarem livres: tal opinião consiste apenas em terem consciência de suas ações e ignorarem as causas que as determinam.","A felicidade não é o prêmio da virtude, mas a própria virtude.","Cada coisa esforça-se, tanto quanto pode, por perseverar em seu ser.","Uma emoção só pode ser refreada ou suprimida por outra emoção contrária e mais forte.","O homem livre em nada pensa menos do que na morte; sua sabedoria é uma meditação da vida.","O ódio é aumentado pelo ódio recíproco e pode ser destruído pelo amor.","A paz não é a ausência de guerra: é uma virtude que nasce da força da alma.","Deus, ou seja, a Natureza."],
"Sartre":["A existência precede a essência.","O inferno são os outros.","O homem nada mais é do que aquilo que ele faz de si mesmo.","Ao escolher por si mesmo, o homem escolhe por todos os homens.","O existencialismo é um humanismo.","O homem é uma paixão inútil.","Não há realidade senão na ação."],
"Simone de Beauvoir":["A representação do mundo, como o próprio mundo, é obra dos homens.","É pelo trabalho que a mulher vem diminuindo a distância que a separava do homem.","A velhice é um segredo vergonhoso de que é indecente falar.","O opressor não seria tão forte se não tivesse cúmplices entre os próprios oprimidos.","Quando um indivíduo é mantido em situação de inferioridade, o fato é que ele é inferior."]});

"Hume":["A beleza das coisas existe no espírito de quem as contempla.","O costume é o grande guia da vida humana.","Um homem sábio proporciona a sua crença à evidência.","Nenhum testemunho basta para estabelecer um milagre, a menos que a sua falsidade fosse ainda mais milagrosa do que o fato que ele pretende estabelecer.","A moral é mais propriamente sentida do que julgada.","Nunca consigo apreender meu eu sem alguma percepção, e nunca observo nada além da percepção.","A ciência do homem é o único fundamento sólido das outras ciências."],

"Aristóteles":["A virtude moral resulta do hábito.","A felicidade é uma atividade da alma em conformidade com a virtude.","A virtude é um meio-termo entre dois vícios, um por excesso e outro por falta.","Todos os homens, por natureza, desejam conhecer.","Uma andorinha não faz verão, nem um só dia.","O amigo é um outro eu.","É próprio do homem culto buscar a precisão em cada assunto na medida em que a natureza do tema o permite.","A natureza nada faz em vão."],
"Maquiavel":["Todos veem o que pareces, poucos sentem o que és.","Os homens esquecem mais depressa a morte do pai do que a perda do patrimônio.","Não há nada mais difícil de conduzir, mais duvidoso de ter êxito e mais perigoso de manejar do que introduzir uma nova ordem de coisas.","Onde há grande vontade, não podem existir grandes dificuldades.","A fortuna é árbitra de metade das nossas ações, mas ainda nos deixa governar a outra metade.","É preciso ser raposa para conhecer as armadilhas e leão para aterrorizar os lobos.","Os homens devem ser bem tratados ou eliminados, pois vingam-se das ofensas leves, mas das graves não podem."],
"Montaigne":["Os homens são atormentados pelas opiniões que têm das coisas, e não pelas coisas em si.","A coisa mais importante do mundo é saber pertencer a si mesmo.","Eu me estudo mais do que qualquer outro assunto: essa é a minha metafísica, essa é a minha física.","Cada homem carrega em si a forma inteira da condição humana.","Se me pressionam a dizer por que o amava, sinto que só posso exprimi-lo respondendo: porque era ele, porque era eu.","No mais alto trono do mundo, ainda estamos sentados sobre o nosso próprio traseiro.","O sinal mais certo da sabedoria é uma alegria constante."]});

"Locke":["Nenhum conhecimento humano pode ir além da nossa experiência.","Onde não há lei, não há liberdade.","Suponhamos que a mente seja, como se diz, um papel em branco, desprovido de todos os caracteres.","Ninguém deve prejudicar outro na sua vida, saúde, liberdade ou posses.","A leitura apenas fornece à mente os materiais do conhecimento; é o pensamento que faz nosso o que lemos.","Onde termina a lei, começa a tirania.","O grande e principal fim dos homens ao se unirem em sociedade e se submeterem a um governo é a preservação da sua propriedade."],

"Rousseau":["O mais forte nunca é forte o bastante para ser sempre o senhor, se não transforma a força em direito e a obediência em dever.","Tudo é bom ao sair das mãos do Autor das coisas; tudo degenera nas mãos do homem.","A vontade geral é sempre reta e tende sempre à utilidade pública.","O primeiro que, tendo cercado um terreno, lembrou-se de dizer 'isto é meu' e encontrou pessoas bastante simples para acreditar nele foi o verdadeiro fundador da sociedade civil.","Viver não é respirar, é agir.","Quem pretende tratar separadamente a política e a moral nunca entenderá nada de nenhuma das duas."],

const PFm={};PF.forEach(a=>PFm[a[0]]=a);
let cur=0,open=false;sel=new Date(today);
const END=new Date(2026,10,9+SCH.length-1);
const ok=d=>d>=START&&d<=new Date(Math.max(END,today));
const sh=(d,k)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+k);
function tabs(i){[0,1].forEach(k=>document.getElementById("t"+k).className=k==i?"on":"")}
function tab(i){cur=i;if(/^#f-/.test(location.hash))location.hash="";else show()}
function show(){tabs(cur);cur?fil():dia()}
function dia(){CARDS.length=0;const isT=+sel==+today,pv=ok(sh(sel,-1)),nx=ok(sh(sel,1));
let h='<section class="hd"><button class="ar" aria-label="Dia anterior" onclick="st(-1)"'+(pv?"":" disabled")+'>‹</button>'
+'<button class="dt" onclick="tg()" aria-expanded="'+open+'"><span class="wk">'+(isT?"Hoje · ":"")+sel.toLocaleDateString("pt-BR",{weekday:"long"})+'</span><span class="dn">'+sel.getDate()+'</span><span class="mo">'+sel.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</span><span class="cl">'+(open?"Fechar calendário":"Escolher outro dia")+'</span></button>'
+'<button class="ar" aria-label="Próximo dia" onclick="st(1)"'+(nx?"":" disabled")+'>›</button></section>';
if(open)h+=grid();
if(!isT)h+='<button class="bt" onclick="go(today)">Voltar para hoje</button>';
h+=daily(sel).map(card).join("")+'<p class="ft">Frases em tradução livre. Toque em um quadro para ver o significado e no nome para conhecer o filósofo.</p>';
v.innerHTML=h}
function grid(){const y=cm.getFullYear(),m=cm.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
const lo=new Date(START.getFullYear(),START.getMonth(),1),hi=new Date(Math.max(END,today));
let h='<div class="cal"><div class="m"><button aria-label="Mês anterior" onclick="mv(-1)"'+(cm>lo?"":" disabled")+'>‹</button><b>'+cm.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</b><button aria-label="Próximo mês" onclick="mv(1)"'+(new Date(y,m+1,1)<=hi?"":" disabled")+'>›</button></div><div class="g">';
"DSTQQSS".split("").forEach(c=>h+="<span>"+c+"</span>");
for(let i=0;i<first;i++)h+="<span></span>";
for(let d=1;d<=n;d++){const dt=new Date(y,m,d);h+='<button '+(ok(dt)?"":"disabled")+' class="'+(+sel==+dt?"s ":"")+(+today==+dt?"td":"")+'" onclick="pk('+y+','+m+','+d+')">'+d+'</button>'}
return h+"</div></div>"}
function tg(){open=!open;if(open)cm=new Date(sel.getFullYear(),sel.getMonth(),1);dia()}
function mv(k){const n=new Date(cm.getFullYear(),cm.getMonth()+k,1),lo=new Date(START.getFullYear(),START.getMonth(),1),hi=new Date(Math.max(END,today));if(n<lo||n>hi)return;cm=n;dia()}
function pk(y,m,d){sel=new Date(y,m,d);open=false;dia()}
function st(k){const n=sh(sel,k);if(ok(n)){sel=n;dia()}}
function go(d){sel=new Date(d);open=false;dia()}
function fil(q=""){CARDS.length=0;v.innerHTML='<input id="q" class="sr" type="search" placeholder="Buscar filósofo, movimento ou época" aria-label="Buscar filósofo" oninput="fl(this.value)"><p class="ct" id="ct"></p><div id="l"></div>';fl(q)}
function fl(q){q=q.toLowerCase();const L2=PV.filter(p=>(p.n+" "+p.m+" "+E(p.y)+" "+R[p.r]).toLowerCase().includes(q)).sort((a,b)=>a.y-b.y);
let h="",last="";
L2.forEach(p=>{const e=E(p.y);if(e!=last){h+='<h2 class="eh">'+e+'</h2>';last=e}
h+='<a class="it" href="#f-'+slug(p.n)+'" onclick="came=true;ly=scrollY"><span><span class="in">'+p.n+'</span><span class="im">'+yr(p.y)+' · '+R[p.r]+' · '+p.m+'</span></span><span class="ch">→</span></a>'});
document.getElementById("l").innerHTML=h||'<p class="ft">Nenhum filósofo encontrado.</p>';
document.getElementById("ct").textContent=L2.length+" de "+PV.length+" filósofos"}
function perfil(p){CARDS.length=0;tabs(1);const a=PFm[p.n];
let h='<a class="pb" href="#" onclick="bk();return false">← Voltar</a><article class="pf"><p class="eb">'+E(p.y)+' · '+R[p.r]+'</p><h1>'+p.n+'</h1><p class="mv">'+p.m+'</p>';

(a?a[3]:[]).forEach(o=>{h+='<section class="ob"><h3>'+o[0]+'</h3><p class="lb">Principais ideias</p><p class="tx">'+o[1]+'</p></section>'});
v.innerHTML=h+'</article>';scrollTo(0,0)}
function route(){const m=/^#f-(.+)$/.exec(location.hash),p=m&&PV.find(p=>slug(p.n)==m[1]);if(p)perfil(p);else{show();if(ly){const y=ly;ly=0;scrollTo(0,y)}}}
function bk(){if(came){came=false;history.back()}else location.hash=""}

route();
